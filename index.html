<meta charset="utf-8">
<title>Enodia</title>
<!--
  Enodia. She of the ways, an epithet of Hecate.

  The charset meta above is the FIRST meta on purpose. A missing one mangled
  every interpunct on the live site once, and the bug is invisible in any
  wrapper that injects its own. scripts/validate.ts checks it on every build.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Enodia is a Hades 2 build companion for the moment you are standing at an Exit: which builds are still live, what just closed, and what you were building before you quit.">
</head>
